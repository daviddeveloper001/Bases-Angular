<h1>{{ name() }}</h1>

<dl>
  <td>Nombre:</td>
  <dd>{{ name() }}</dd>

  <td>Edad:</td>
  <dd>{{ age() }}</dd>

  <td>Método:</td>
  <dd>{{ getHeroDescription() }}</dd>

  <td>Capitalizado:</td>
  <!-- ! Intentar  -->
  <dd> {{ capitalizedName }} </dd>
</dl>

<button type="button" (click)="changeHero()" class="btn btn-success mx-2">
  Cambiar nombre
</button>

<button type="button" (click)="chageAge()" class="btn btn-primary">Cambiar edad</button>

<button type="button" (click)="resetForm()" class="btn btn-warning mx-2">Reset</button>
